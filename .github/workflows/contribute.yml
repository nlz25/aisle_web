name: Deploy Contribute API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribute-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: contribute-production
    env:
      CONTRIBUTE_WORKSPACE_ORIGIN: ${{ secrets.CLOUDFLARE_WORKSPACE_ORIGIN }}
    defaults:
      run:
        working-directory: services/contribute
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        if: env.CONTRIBUTE_WORKSPACE_ORIGIN != ''
        with:
          python-version: '3.12'
      - name: Build standalone workspace
        if: env.CONTRIBUTE_WORKSPACE_ORIGIN != ''
        working-directory: .
        env:
          CONTRIBUTE_WORKSPACE_ORIGIN: ${{ secrets.CLOUDFLARE_WORKSPACE_ORIGIN }}
        run: python scripts/build_site.py --worker-assets
      - name: Prepare, migrate, and deploy
        env:
          CONTRIBUTE_WORKSPACE_ORIGIN: ${{ secrets.CLOUDFLARE_WORKSPACE_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
          SUPABASE_STORAGE_SECRET: ${{ secrets.SUPABASE_STORAGE_SECRET }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Configure the Cloudflare deployment token}"
          trap 'rm -f .wrangler/production-secrets.json' EXIT
          node prepare-deploy.mjs
          npx --no-install wrangler deploy --dry-run --config .wrangler/production.json
          npx --no-install wrangler d1 migrations apply DB --remote --config .wrangler/production.json
          npx --no-install wrangler deploy --config .wrangler/production.json --secrets-file .wrangler/production-secrets.json
